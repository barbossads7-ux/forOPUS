<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recipes</title><style>body{margin:0;font-family:Georgia,serif;background:#fff;color:#111}</style></head><body><main>
<!--
  Recipe: interactive-product-demo (vanilla HTML/CSS/JS, no dependencies).
  A live replica of one product screen: a scripted scenario plays itself when the
  demo scrolls into view (a cursor types and clicks), and the visitor can take
  over at any moment by typing into the real input.
  Replace: the markup inside .demo__app with the product's real key screen, the
  STEPS list with its real flow, and run() with the product's real logic.
  Only show UI that exists in the product.
-->
<section class="demo" id="demo" aria-labelledby="demo-title">
  <div class="demo__text">
    <h1 id="demo-title" class="demo__title">Paste a messy list. Get a plan.</h1>
    <p class="demo__lead">This is the real sorting logic running in your browser. Watch it, or type your own task.</p>
  </div>

  <div class="demo__window" role="region" aria-label="Product demo">
    <div class="demo__app">
      <form class="demo__form" autocomplete="off">
        <label class="demo__label" for="demo-input">New task</label>
        <div class="demo__row">
          <input id="demo-input" class="demo__input" data-demo="input" placeholder="e.g. Fix login bug, urgent">
          <button class="demo__add" data-demo="add" type="submit">Add</button>
        </div>
      </form>
      <ol class="demo__list" data-demo="list" aria-live="polite"></ol>
    </div>
    <div class="demo__cursor" aria-hidden="true"></div>
  </div>

  <div class="demo__controls">
    <button type="button" class="demo__toggle" aria-pressed="false">Play demo</button>
    <button type="button" class="demo__reset">Reset</button>
  </div>
</section>

<style>
  .demo {
    --demo-bg: #f4f2ee; --demo-ink: #1c1b19; --demo-line: #d7d3cb; --demo-accent: #b4441c;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 32px 56px;
    align-items: center; padding: clamp(24px, 6vw, 96px); background: var(--demo-bg); color: var(--demo-ink);
  }
  .demo__title { margin: 0 0 12px; font-size: clamp(28px, 4vw, 52px); line-height: 1.05; }
  .demo__lead { margin: 0; max-width: 38ch; font-size: 17px; line-height: 1.5; }
  .demo__window { position: relative; border: 1px solid var(--demo-line); border-radius: 10px; background: #fff; padding: 20px; min-height: 340px; }
  .demo__label { display: block; margin-bottom: 6px; font-size: 14px; }
  .demo__row { display: flex; gap: 8px; }
  .demo__input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--demo-line); border-radius: 6px; font: inherit; font-size: 16px; }
  .demo__add, .demo__toggle, .demo__reset {
    min-height: 44px; padding: 0 16px; border: 1px solid var(--demo-ink); border-radius: 6px;
    background: var(--demo-ink); color: #fff; font: inherit; cursor: pointer;
  }
  .demo__reset { background: transparent; color: inherit; }
  .demo__add.is-pressed { transform: scale(0.96); }
  .demo__list { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .demo__item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--demo-line); border-radius: 6px; font-size: 15px; animation: demo-in 250ms ease both; }
  .demo__tag { flex: none; font-size: 13px; color: var(--demo-accent); }
  .demo__cursor {
    position: absolute; left: 0; top: 0; width: 18px; height: 18px; pointer-events: none; opacity: 0;
    border-left: 2px solid var(--demo-ink); border-top: 2px solid var(--demo-ink); transform-origin: 0 0;
    transition: transform 600ms cubic-bezier(.3,.7,.2,1), opacity 200ms ease;
  }
  .demo.is-playing .demo__cursor { opacity: 1; }
  .demo__controls { grid-column: 2; display: flex; gap: 8px; }
  .demo :focus-visible { outline: 2px solid var(--demo-accent); outline-offset: 2px; }
  @keyframes demo-in { from { opacity: 0; transform: translateY(6px); } }

  @media (max-width: 720px) {
    .demo { grid-template-columns: 1fr; }
    .demo__controls { grid-column: 1; }
    .demo__cursor { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .demo__item { animation: none; }
    .demo__cursor { transition: none; }
  }
</style>

<script type="module">
  const root = document.getElementById("demo");
  if (root) {
    const $ = (name) => root.querySelector(`[data-demo="${name}"]`);
    const form = root.querySelector(".demo__form");
    const input = $("input");
    const list = $("list");
    const cursor = root.querySelector(".demo__cursor");
    const toggle = root.querySelector(".demo__toggle");
    const windowEl = root.querySelector(".demo__window");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

    // The product's logic. Replace with the real one (or a faithful copy).
    const run = (text) => {
      const urgent = /urgent|asap|today|bug/i.test(text);
      return { text, tag: urgent ? "This sprint" : "Backlog" };
    };
    const addTask = (text) => {
      if (!text.trim()) return;
      const { tag } = run(text);
      const li = document.createElement("li");
      li.className = "demo__item";
      li.append(Object.assign(document.createElement("span"), { textContent: text }));
      li.append(Object.assign(document.createElement("span"), { className: "demo__tag", textContent: tag }));
      list.append(li);
    };

    // The scripted scenario: what a new user does in the first 10 seconds.
    const STEPS = [
      { type: "type", target: "input", text: "Fix login bug, urgent" },
      { type: "click", target: "add" },
      { type: "type", target: "input", text: "Redesign settings page" },
      { type: "click", target: "add" },
      { type: "type", target: "input", text: "Ship invoices export today" },
      { type: "click", target: "add" },
    ];

    let playing = false;
    let token = 0; // bumps on stop, so a running scenario notices and quits
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const moveCursorTo = async (el) => {
      const a = windowEl.getBoundingClientRect();
      const b = el.getBoundingClientRect();
      cursor.style.transform = `translate(${b.left - a.left + b.width * 0.6}px, ${b.top - a.top + b.height * 0.6}px)`;
      await wait(reduce.matches ? 0 : 650);
    };

    const setPlaying = (on) => {
      playing = on;
      root.classList.toggle("is-playing", on);
      toggle.setAttribute("aria-pressed", String(on));
      toggle.textContent = on ? "Pause demo" : "Play demo";
      if (!on) token++;
    };

    const play = async () => {
      const mine = ++token;
      setPlaying(true);
      for (const step of STEPS) {
        if (mine !== token) return;
        const el = $(step.target);
        await moveCursorTo(el);
        if (step.type === "type") {
          input.value = "";
          for (const ch of step.text) {
            if (mine !== token) return;
            input.value += ch;
            await wait(reduce.matches ? 0 : 45);
          }
        } else if (step.type === "click") {
          el.classList.add("is-pressed");
          await wait(120);
          el.classList.remove("is-pressed");
          addTask(input.value);
          input.value = "";
        }
        await wait(reduce.matches ? 0 : 400);
      }
      if (mine === token) setPlaying(false);
    };

    // The visitor takes over: any real input stops the script.
    const takeOver = () => { if (playing) setPlaying(false); };
    input.addEventListener("pointerdown", takeOver);
    input.addEventListener("keydown", takeOver);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      addTask(input.value);
      input.value = "";
    });
    toggle.addEventListener("click", () => (playing ? setPlaying(false) : play()));
    root.querySelector(".demo__reset").addEventListener("click", () => {
      setPlaying(false);
      list.replaceChildren();
      input.value = "";
    });

    // Autoplay once when the demo is on screen; under reduced motion, show the end state instead.
    let started = false;
    new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting || started) return;
      started = true;
      if (reduce.matches) STEPS.filter((s) => s.type === "type").forEach((s) => addTask(s.text));
      else play();
    }, { threshold: 0.5 }).observe(windowEl);
  }
</script>

<!--
  Recipe: variant-switcher (vanilla HTML/CSS/JS, no dependencies).
  Replace: the swatch list (data-* attributes), image paths, labels, colors.
  Every variant photo must be shot from the same tripod position and light.
-->
<section class="vs" id="variants" aria-labelledby="vs-title">
  <div class="vs__text">
    <h2 id="vs-title" class="vs__title">Pick a color</h2>
    <p class="vs__lead">Every color is photographed from the same spot in the same light, so what you see is what arrives.</p>
  </div>

  <figure class="vs__stage">
    <picture>
      <source class="vs__source" type="image/avif" srcset="assets/variant-sand.svg">
      <img class="vs__img" src="assets/variant-sand.svg" width="1600" height="1200"
           alt="The product in Sand" fetchpriority="high" decoding="async">
    </picture>
    <figcaption class="vs__caption" aria-live="polite">Sand</figcaption>
  </figure>

  <div class="vs__swatches" role="group" aria-label="Color">
    <button type="button" class="vs__swatch" aria-pressed="true"
            data-name="Sand" data-avif="assets/variant-sand.svg" data-jpg="assets/variant-sand.svg"
            data-bg="#ece6dc" data-ink="#24211d" style="--swatch: #d8c9b1">
      <span class="vs__dot" aria-hidden="true"></span><span class="vs__label">Sand</span>
    </button>
    <button type="button" class="vs__swatch" aria-pressed="false"
            data-name="Moss" data-avif="assets/variant-moss.svg" data-jpg="assets/variant-moss.svg"
            data-bg="#dfe3d6" data-ink="#1f251c" style="--swatch: #6f7d5c">
      <span class="vs__dot" aria-hidden="true"></span><span class="vs__label">Moss</span>
    </button>
    <button type="button" class="vs__swatch" aria-pressed="false"
            data-name="Ink" data-avif="assets/variant-ink.svg" data-jpg="assets/variant-ink.svg"
            data-bg="#d9dce3" data-ink="#161a22" style="--swatch: #2b3140">
      <span class="vs__dot" aria-hidden="true"></span><span class="vs__label">Ink</span>
    </button>
  </div>
</section>

<style>
  .vs {
    --vs-bg: #ece6dc;
    --vs-ink: #24211d;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    grid-template-areas: "text stage" "swatches stage";
    gap: 24px 48px;
    align-items: center;
    padding: clamp(24px, 6vw, 96px);
    background: var(--vs-bg);
    color: var(--vs-ink);
    transition: background-color 400ms ease, color 400ms ease;
  }
  .vs__text { grid-area: text; align-self: end; }
  .vs__title { margin: 0 0 12px; font-size: clamp(28px, 4vw, 52px); line-height: 1.05; }
  .vs__lead { margin: 0; max-width: 36ch; font-size: 17px; line-height: 1.5; }
  .vs__stage { grid-area: stage; margin: 0; position: relative; }
  .vs__img { display: block; width: 100%; height: auto; transition: opacity 250ms ease; }
  .vs__img.is-swapping { opacity: 0; }
  .vs__caption { margin-top: 12px; font-size: 15px; }
  .vs__swatches { grid-area: swatches; align-self: start; display: flex; flex-wrap: wrap; gap: 8px; }
  .vs__swatch {
    display: inline-flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 6px 14px 6px 6px;
    border: 1px solid color-mix(in srgb, var(--vs-ink) 25%, transparent);
    border-radius: 999px; background: transparent; color: inherit;
    font: inherit; font-size: 15px; cursor: pointer;
  }
  .vs__swatch[aria-pressed="true"] { border-color: var(--vs-ink); box-shadow: inset 0 0 0 1px var(--vs-ink); }
  .vs__swatch:focus-visible { outline: 2px solid var(--vs-ink); outline-offset: 3px; }
  .vs__dot { width: 30px; height: 30px; border-radius: 50%; background: var(--swatch); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.15); }

  @media (max-width: 720px) {
    .vs { grid-template-columns: 1fr; grid-template-areas: "text" "stage" "swatches"; }
    .vs__swatch { min-height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .vs, .vs__img { transition: none; }
  }
</style>

<script type="module">
  const root = document.getElementById("variants");
  if (root) {
    const img = root.querySelector(".vs__img");
    const source = root.querySelector(".vs__source");
    const caption = root.querySelector(".vs__caption");
    const swatches = [...root.querySelectorAll(".vs__swatch")];
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    const cache = new Map();
    // The browser already picked AVIF or JPEG for the first photo; preload the same format.
    const usesAvif = () => (img.currentSrc || "").endsWith(".avif");

    // Load a variant photo only when it is about to be needed (hover, focus, tap).
    const preload = (btn) => {
      const url = usesAvif() ? btn.dataset.avif : btn.dataset.jpg;
      if (!cache.has(url)) {
        const pic = new Image();
        pic.src = url;
        cache.set(url, pic.decode().catch(() => undefined));
      }
      return cache.get(url);
    };

    const select = async (btn) => {
      if (btn.getAttribute("aria-pressed") === "true") return;
      swatches.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      root.style.setProperty("--vs-bg", btn.dataset.bg);
      root.style.setProperty("--vs-ink", btn.dataset.ink);
      caption.textContent = btn.dataset.name;
      await preload(btn);
      const swap = () => {
        source.srcset = btn.dataset.avif;
        img.src = btn.dataset.jpg;
        img.alt = `The product in ${btn.dataset.name}`;
        img.classList.remove("is-swapping");
      };
      if (reduce.matches) return swap();
      img.classList.add("is-swapping");
      setTimeout(swap, 250);
    };

    swatches.forEach((btn, i) => {
      btn.addEventListener("pointerenter", () => preload(btn));
      btn.addEventListener("focus", () => preload(btn));
      btn.addEventListener("click", () => select(btn));
      // Arrow keys move between swatches, like a native radio group.
      btn.addEventListener("keydown", (e) => {
        const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        const next = swatches[(i + step + swatches.length) % swatches.length];
        next.focus();
        select(next);
      });
    });
  }
</script>

<!--
  Recipe: detail-proof (vanilla HTML/CSS/JS, no dependencies).
  A product photo with a macro loupe (fine pointers) or a tap-to-zoom macro view
  (touch, keyboard), plus one short clip of a real test that proves the property.
  Replace: image and video paths, the property and what the test proves.
  assets/detail-macro.svg must have the SAME framing as the photo, at 2-3x the
  resolution (or a macro shot aligned to it): the loupe maps cursor position 1:1.
  Never fake the test: a generated "proof" is a lie.
-->
<section class="dp" id="detail-proof" aria-labelledby="dp-title">
  <h2 id="dp-title" class="dp__title">Hand-stitched, eleven stitches per inch</h2>

  <div class="dp__grid">
    <figure class="dp__inspect" data-macro="assets/detail-macro.svg">
      <div class="dp__frame">
        <img class="dp__photo" src="assets/detail-photo.svg" width="1600" height="1200"
             alt="The seam of the bag, photographed from the side" loading="lazy" decoding="async">
        <img class="dp__macro" alt="Macro of the seam: each stitch is pulled tight by hand" hidden
             width="2000" height="1500" decoding="async">
        <div class="dp__lens" aria-hidden="true"></div>
      </div>
      <figcaption class="dp__caption">
        <button type="button" class="dp__zoom" aria-pressed="false">Look closer</button>
        <span>Machine seams run 6–8 stitches per inch; ours run eleven.</span>
      </figcaption>
    </figure>

    <figure class="dp__proof">
      <video class="dp__clip" muted playsinline loop preload="none" width="1080" height="1080"
             poster="assets/proof-poster.svg" aria-describedby="dp-proof-text">
        <source src="assets/proof.webm" type="video/webm">
        <source src="assets/proof.mp4" type="video/mp4">
      </video>
      <figcaption class="dp__caption">
        <button type="button" class="dp__play" aria-pressed="false">Play test</button>
        <span id="dp-proof-text">One take, no cuts: 20 kg hangs on a single strap for an hour. The seam does not move.</span>
      </figcaption>
    </figure>
  </div>
</section>

<style>
  .dp { --dp-bg: #f7f5f1; --dp-ink: #1c1b19; padding: clamp(24px, 6vw, 96px); background: var(--dp-bg); color: var(--dp-ink); }
  .dp__title { margin: 0 0 32px; max-width: 22ch; font-size: clamp(28px, 4vw, 52px); line-height: 1.05; }
  .dp__grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  .dp__inspect, .dp__proof { margin: 0; }
  .dp__frame { position: relative; overflow: hidden; }
  .dp__photo, .dp__macro, .dp__clip { display: block; width: 100%; height: auto; }
  .dp__macro { position: absolute; inset: 0; height: 100%; object-fit: cover; }
  .dp__macro[hidden] { display: none; }
  .dp__lens {
    position: absolute; left: 0; top: 0; width: 220px; height: 220px;
    border-radius: 50%; pointer-events: none; opacity: 0;
    box-shadow: 0 0 0 2px #fff, 0 8px 30px rgb(0 0 0 / 0.35);
    background-repeat: no-repeat; transition: opacity 150ms ease;
    will-change: transform;
  }
  .dp__frame.is-lens .dp__lens { opacity: 1; }
  .dp__caption { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 12px; font-size: 16px; line-height: 1.45; }
  .dp__zoom, .dp__play {
    min-height: 44px; padding: 0 16px; border: 1px solid currentColor; border-radius: 6px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  .dp__zoom:focus-visible, .dp__play:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  @media (max-width: 720px) {
    .dp__grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dp__lens { transition: none; }
  }
</style>

<script type="module">
  const root = document.getElementById("detail-proof");
  if (root) {
    const inspect = root.querySelector(".dp__inspect");
    const frame = root.querySelector(".dp__frame");
    const macro = root.querySelector(".dp__macro");
    const lens = root.querySelector(".dp__lens");
    const zoom = root.querySelector(".dp__zoom");
    const macroUrl = inspect.dataset.macro;
    const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

    // The macro file loads only when someone asks to look closer.
    let macroReady;
    const loadMacro = () => {
      if (!macroReady) {
        macro.src = macroUrl;
        macroReady = macro.decode().catch(() => undefined);
      }
      return macroReady;
    };

    // Tap, click or keyboard: show the whole macro in place of the photo.
    zoom.addEventListener("click", async () => {
      const on = zoom.getAttribute("aria-pressed") !== "true";
      zoom.setAttribute("aria-pressed", String(on));
      zoom.textContent = on ? "Back to the photo" : "Look closer";
      if (on) await loadMacro();
      macro.hidden = !on;
    });

    // Fine pointer: a loupe follows the cursor over the photo.
    const ZOOM = 2.5;
    let frameReq = 0;
    frame.addEventListener("pointerenter", () => {
      if (!finePointer.matches || !macro.hidden) return;
      loadMacro().then(() => {
        lens.style.backgroundImage = `url("${macroUrl}")`;
        frame.classList.add("is-lens");
      });
    });
    frame.addEventListener("pointerleave", () => frame.classList.remove("is-lens"));
    frame.addEventListener("pointermove", (e) => {
      if (!frame.classList.contains("is-lens")) return;
      cancelAnimationFrame(frameReq);
      frameReq = requestAnimationFrame(() => {
        const box = frame.getBoundingClientRect();
        const x = e.clientX - box.left;
        const y = e.clientY - box.top;
        const r = lens.offsetWidth / 2;
        lens.style.transform = `translate(${x - r}px, ${y - r}px)`;
        lens.style.backgroundSize = `${box.width * ZOOM}px ${box.height * ZOOM}px`;
        lens.style.backgroundPosition = `${-(x * ZOOM - r)}px ${-(y * ZOOM - r)}px`;
      });
    });

    // Proof clip: loads and plays only while on screen; never autoplays under reduced motion.
    const clip = root.querySelector(".dp__clip");
    const play = root.querySelector(".dp__play");
    let userPaused = reduce.matches;
    const setPlaying = (on) => {
      play.setAttribute("aria-pressed", String(on));
      play.textContent = on ? "Pause test" : "Play test";
    };
    const start = () => clip.play().then(() => setPlaying(true), () => setPlaying(false));
    const stop = () => { clip.pause(); setPlaying(false); };
    play.addEventListener("click", () => {
      if (clip.paused) { userPaused = false; start(); } else { userPaused = true; stop(); }
    });
    new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !userPaused) start();
      else if (!entry.isIntersecting && !clip.paused) stop();
    }, { threshold: 0.5 }).observe(clip);
  }
</script>

</main></body></html>
